<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Surf Radar tests</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; }
      .pass { color: #17663a; }
      .fail { color: #b3261e; font-weight: 700; }
      li { margin-block: 2px; }
    </style>
  </head>
  <body>
    <h1 id="summary">Running…</h1>
    <ul id="results"></ul>

    <script type="module">
      import { buoys } from '../buoys.js';
      import { settings } from '../settings.js';
      import { spots } from '../spots.js';
      import { computeBias, correctionFactor, distanceKm, distanceStrength } from '../src/correction.js';
      import { parseNdbcText } from '../src/sources/ndbc.js';
      import { blendValues, blendReadings } from '../src/blend.js';
      import { confidenceLabel, HIGH, MEDIUM, LOW } from '../src/confidence.js';
      import { averageDirection, buildBuoyStatus, buildSpotForecast, localHourKey } from '../src/pipeline.js';
      import { ALL_DAY, applyView, bestDay, bestDayInRange, DEFAULT_VIEW, formatDrive, formatDriveShort, restoreView, slotForTime } from '../src/filters.js';
      import { interpolate, scoreConditions, scoreDay, toRating } from '../src/rating.js';
      import { parseMarineLocation, parseWindLocation } from '../src/sources/open-meteo.js';

      const results = [];
      const close = (a, b) => a !== null && b !== null && Math.abs(a - b) < 1e-9;

      function check(name, passed, detail = '') {
        results.push({ name, passed, detail });
      }
      const same = (name, actual, expected) =>
        check(
          name,
          typeof expected === 'number' ? close(actual, expected) : JSON.stringify(actual) === JSON.stringify(expected),
          `got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`,
        );

      const profile = settings.profiles.adrian;
      const score = (waveHeightFt, swellPeriodS) => scoreConditions({ waveHeightFt, swellPeriodS }, profile);
      const rules = settings.confidence;

      // --- Blend ---
      same('blend: one model passes through with unknown spread', blendValues([3.2]), { value: 3.2, spread: null, count: 1 });
      same('blend: no values gives nothing', blendValues([null, undefined]), { value: null, spread: null, count: 0 });
      same('blend: median of an odd count', blendValues([1, 5, 2]).value, 2);
      same('blend: median of an even count', blendValues([1, 2, 3, 6]).value, 2.5);
      same('blend: spread is highest minus lowest', blendValues([1, 2, 3, 6]).spread, 5);
      same('blend: skips missing values', blendValues([2, null, 4]), { value: 3, spread: 2, count: 2 });
      same('blend: readings with one model have unknown spread', blendReadings([{ waveHeightFt: 3, swellPeriodS: 8 }]), { waveHeightFt: 3, swellPeriodS: 8, heightSpreadFt: null });
      same('blend: readings with two models report height spread', blendReadings([{ waveHeightFt: 3 }, { waveHeightFt: 4 }]), { waveHeightFt: 3.5, heightSpreadFt: 1 });

      // --- Rating ---
      same('rating: interpolate is flat before the first point', interpolate(profile.periodCurve, 3), -0.5);
      same('rating: interpolate is flat after the last point', interpolate(profile.periodCurve, 12), 0.5);
      same('rating: under 2.5 ft scores 1', score(2.4, 7), 1);
      same('rating: a long period can not lift a small day', score(1.5, 12), 1);
      same('rating: 2.5 ft at a neutral period scores 2.5', score(2.5, 7), 2.5);
      same('rating: 4 ft at a neutral period scores 4.5', score(4, 7), 4.5);
      same('rating: 5 ft at a neutral period scores 5', score(5, 7), 5);
      same('rating: halfway between size points', score(3.25, 7), 3.5);
      same('rating: 6 s takes off half a point', score(4, 6), 4);
      same('rating: under 6 s still takes off only half a point', score(4, 4), 4);
      same('rating: 8 s adds half a point', score(3.25, 8), 4);
      same('rating: 7.5 s adds a quarter point', score(3.25, 7.5), 3.75);
      same('rating: a 2.7 ft day at 8 s is fair, not good', toRating(score(2.7, 8)), 3);
      same('rating: a 3.4 ft day at 8 s is good, not great', toRating(score(3.4, 8)), 4);
      same('rating: a 3.9 ft day at 8 s is great', toRating(score(3.9, 8)), 5);
      same('rating: big days stay capped at 5', score(10, 14), 5);
      same('rating: missing period leaves the score alone', score(4, null), 4.5);
      same('rating: missing height gives no score', score(null, 8), null);
      same('rating: morning counts 75%, midday 25%', scoreDay({ morning: { waveHeightFt: 4, swellPeriodS: 7 }, midday: { waveHeightFt: 2.5, swellPeriodS: 7 } }, profile), 4);
      same('rating: a missing window gives the other full weight', scoreDay({ morning: { waveHeightFt: null }, midday: { waveHeightFt: 4, swellPeriodS: 7 } }, profile), 4.5);
      same('rating: no data gives no score', scoreDay({ morning: {}, midday: {} }, profile), null);
      same('rating: rounds for display', toRating(3.5), 4);
      same('rating: no score gives no rating', toRating(null), null);

      // --- Confidence ---
      const label = (dayIndex, spreadFt = null) => confidenceLabel({ dayIndex, spreadFt }, rules);
      same('confidence: today is high', label(0), HIGH);
      same('confidence: Day 3 is high', label(3), HIGH);
      same('confidence: Day 4 is medium', label(4), MEDIUM);
      same('confidence: Day 5 is medium', label(5), MEDIUM);
      same('confidence: Day 6 is low', label(6), LOW);
      same('confidence: Day 7 is low', label(7), LOW);
      same('confidence: models agreeing keeps Day 2 high', label(2, 0.5), HIGH);
      same('confidence: models disagreeing drops Day 2 to medium', label(2, 1.5), MEDIUM);
      same('confidence: big disagreement drops Day 2 to low', label(2, 2.5), LOW);
      same('confidence: big disagreement drops Day 4 to low', label(4, 2.5), LOW);

      // --- Open-Meteo format ---
      const singleModel = { hourly: { time: ['t0'], wave_height: [3], swell_wave_period: [8], wave_period: [6] } };
      same('source: reads unsuffixed fields with one model', parseMarineLocation(singleModel, ['a']).models.a, { waveHeightFt: [3], swellPeriodS: [8], wavePeriodS: [6] });
      const twoModels = { hourly: { time: ['t0'], wave_height_a: [3], swell_wave_period_a: [8], wave_period_a: [6], wave_height_b: [4], wave_period_b: [7] } };
      same('source: reads suffixed fields with two models', parseMarineLocation(twoModels, ['a', 'b']).models.b.waveHeightFt, [4]);
      same('source: a field a model lacks becomes empty values', parseMarineLocation(twoModels, ['a', 'b']).models.b.swellPeriodS, [null]);
      same(
        'source: wind lines up with marine times',
        parseWindLocation({ hourly: { time: ['t1', 't0'], wind_speed_10m: [20, 10], wind_direction_10m: [200, 100] } }, ['t0', 't1', 't2']),
        { speedMph: [10, 20, null], directionDeg: [100, 200, null] },
      );

      // --- Pipeline ---
      same('pipeline: wind direction averages across north', Math.round(averageDirection([350, 10])) % 360, 0);
      same('pipeline: local hour uses the beach time zone', localHourKey(new Date('2026-11-06T17:30:00Z'), 'America/New_York'), '2026-11-06T12:00');

      const times = [];
      for (const date of ['2026-11-06', '2026-11-07']) {
        for (let hour = 0; hour < 24; hour++) times.push(`${date}T${String(hour).padStart(2, '0')}:00`);
      }
      // 4 ft from 6–10 am, 2.5 ft from 10 am–2 pm, and 99 ft outside the windows, which must be ignored.
      const heights = times.map((time) => {
        const hour = Number(time.slice(11, 13));
        return hour >= 6 && hour < 10 ? 4 : hour >= 10 && hour < 14 ? 2.5 : 99;
      });
      const data = {
        times,
        models: { only: { waveHeightFt: heights, swellPeriodS: times.map(() => 7), wavePeriodS: times.map(() => 5) } },
        wind: null,
      };
      const built = buildSpotForecast({ id: 'test', name: 'Test' }, data, settings, '2026-11-06T07:00');
      const firstDay = built.days[0];
      same('pipeline: groups hours into days', built.days.length, 2);
      same('pipeline: morning ignores hours outside the window', firstDay.final.morning.waveHeightFt, 4);
      same('pipeline: midday ignores hours outside the window', firstDay.final.midday.waveHeightFt, 2.5);
      same('pipeline: keeps the unrounded score', firstDay.score, 4);
      same('pipeline: stores each model under its name', firstDay.raw.only.morning.waveHeightFt, 4);
      same('pipeline: keeps overall wave period', firstDay.final.morning.wavePeriodS, 5);
      same('pipeline: spread is unknown with one model', firstDay.spreadFt, null);
      same('pipeline: flags start empty', firstDay.flags, []);
      same('pipeline: labels confidence by lead time', firstDay.confidence, HIGH);
      same('pipeline: reports the current hour', built.now.waveHeightFt, 4);
      same('pipeline: missing wind stays empty', firstDay.wind.morning.speedMph, null);

      const twoModelData = { ...data, models: { ...data.models, other: { waveHeightFt: heights.map((h) => h + 1), swellPeriodS: times.map(() => 7), wavePeriodS: times.map(() => 5) } } };
      same('pipeline: two models produce a spread', buildSpotForecast({ id: 'test' }, twoModelData, settings, '2026-11-06T07:00').days[0].spreadFt, 1);

      const afternoon = buildSpotForecast({ id: 'test' }, data, settings, '2026-11-06T15:00').days;
      same('pipeline: at 3 pm the morning has passed', afternoon[0].slots.morning.past, true);
      same('pipeline: at 3 pm the midday has passed', afternoon[0].slots.midday.past, true);
      same('pipeline: at 3 pm the evening is still open', afternoon[0].slots.evening.past, false);
      same('pipeline: tomorrow has not passed', afternoon[1].slots.morning.past, false);
      same('pipeline: a window in progress has not passed', firstDay.slots.morning.past, false);
      same('pipeline: each time of day gets its own slot', Object.keys(firstDay.slots), ['morning', 'midday', 'evening']);
      same('pipeline: morning slot has its own rating', firstDay.slots.morning.rating, 5);
      same('pipeline: midday slot has its own rating', firstDay.slots.midday.rating, 3);
      same('pipeline: evening slot covers 2 pm to 6 pm', firstDay.slots.evening.final.waveHeightFt, 99);
      same('pipeline: evening does not change the whole-day score', firstDay.score, 4);
      const twoModelDay = buildSpotForecast({ id: 'test' }, twoModelData, settings, '2026-11-06T07:00').days[0];
      same('pipeline: each slot keeps its own spread', twoModelDay.slots.morning.spreadFt, 1);
      same('pipeline: slots blend the models', twoModelDay.slots.morning.final.waveHeightFt, 4.5);

      // Three models where one has no swell period, like ECMWF, and one disagrees a lot.
      const threeModels = { ...data, models: {
        a: { waveHeightFt: times.map(() => 3), swellPeriodS: times.map(() => 8), wavePeriodS: times.map(() => 6) },
        b: { waveHeightFt: times.map(() => 3.5), swellPeriodS: times.map(() => 6), wavePeriodS: times.map(() => 6) },
        c: { waveHeightFt: times.map(() => 6), swellPeriodS: times.map(() => null), wavePeriodS: times.map(() => 6) },
      } };
      const threeModelSlot = buildSpotForecast({ id: 'test' }, threeModels, settings, '2026-11-06T07:00').days[0].slots.morning;
      same('pipeline: the middle value ignores an outlier', threeModelSlot.final.waveHeightFt, 3.5);
      same('pipeline: period skips the model without one', threeModelSlot.final.swellPeriodS, 7);
      same('pipeline: big disagreement lowers confidence', threeModelSlot.confidence, LOW);
      same('settings: every model has a label', settings.models.every((model) => model.id && model.label), true);

      // --- Filters ---
      // Spots in north-to-south order, each with [Today's rating, Saturday's rating] and a drive time.
      const fakeSpot = (id, ratings, minutes) => ({
        id,
        driveMinutes: minutes === null ? {} : { doral: minutes },
        days: ratings.map((rating, dayIndex) => fakeDay(dayIndex, rating)),
      });
      function fakeDay(dayIndex, morning, midday = 1, evening = 1) {
        const slot = (name, rating) => ({ name, rating, score: rating });
        return { dayIndex, slots: { morning: slot('morning', morning), midday: slot('midday', midday), evening: slot('evening', evening) } };
      }
      const fakeForecast = [
        fakeSpot('far-4', [4, 1], 200),
        fakeSpot('far-5', [5, 2], 180),
        fakeSpot('mid-3', [3, 5], 90),
        fakeSpot('near-4', [4, 3], 50),
        fakeSpot('near-5', [5, 1], 30),
        fakeSpot('near-1', [1, 4], 40),
      ];
      const options = { homeId: 'doral', worthSurfingRating: 3 };
      const order = (changes) => applyView(fakeForecast, { ...DEFAULT_VIEW, ...changes }, options).map((spot) => spot.id);

      same('filters: north to south keeps the original order', order({}), ['far-4', 'far-5', 'mid-3', 'near-4', 'near-5', 'near-1']);
      same('filters: best to worst puts the closest first within each rating', order({ sort: 'best' }), ['near-5', 'far-5', 'near-4', 'far-4', 'mid-3', 'near-1']);
      same('filters: closest to farthest ignores rating', order({ sort: 'closest' }), ['near-5', 'near-1', 'near-4', 'mid-3', 'far-5', 'far-4']);
      same('filters: best first uses the best day in the range', order({ sort: 'best', rangeDays: 2 }), ['near-5', 'mid-3', 'far-5', 'near-1', 'near-4', 'far-4']);
      same('filters: worth surfing keeps 3 and up', order({ worthSurfingOnly: true }), ['far-4', 'far-5', 'mid-3', 'near-4', 'near-5']);
      same('filters: worth surfing counts any day in the range', order({ worthSurfingOnly: true, rangeDays: 2 }), ['far-4', 'far-5', 'mid-3', 'near-4', 'near-5', 'near-1']);
      same('filters: a range of 1 only looks at today', bestDayInRange(fakeForecast[2], 1, 'morning').day.dayIndex, 0);
      same('filters: a longer range finds the later best day', bestDayInRange(fakeForecast[2], 2, 'morning').day.dayIndex, 1);
      same('filters: a range longer than the forecast still works', bestDayInRange(fakeForecast[2], 7, 'morning').day.dayIndex, 1);

      // Better in the evening: skip it in the morning, great at 5.
      const eveningDay = fakeDay(0, 1, 2, 5);
      same('time: morning uses the morning rating', slotForTime(eveningDay, 'morning').rating, 1);
      same('time: evening uses the evening rating', slotForTime(eveningDay, 'evening').rating, 5);
      same('time: all day finds the best window', slotForTime(eveningDay, ALL_DAY).name, 'evening');
      same('time: all day ties go to the earliest window', slotForTime(fakeDay(0, 3, 3, 3), ALL_DAY).name, 'morning');
      same('time: all day compares unrounded scores', slotForTime({ slots: { morning: { name: 'morning', rating: 4, score: 3.6 }, midday: { name: 'midday', rating: 4, score: 4.4 } } }, ALL_DAY).name, 'midday');
      same('time: all day skips windows with no score', slotForTime({ slots: { morning: { name: 'morning', rating: null, score: null }, midday: { name: 'midday', rating: 2, score: 2 } } }, ALL_DAY).name, 'midday');
      const eveningSpot = { id: 'evening-spot', driveMinutes: { doral: 10 }, days: [eveningDay] };
      const pastDay = fakeDay(0, 5, 2, 3);
      pastDay.slots.morning.past = true;
      same('time: all day skips a window that has passed', slotForTime(pastDay, ALL_DAY).name, 'evening');
      const allPastDay = fakeDay(0, 5, 2, 3);
      Object.values(allPastDay.slots).forEach((slot) => { slot.past = true; });
      same('time: all day still answers once every window has passed', slotForTime(allPastDay, ALL_DAY).name, 'morning');
      same('time: look-ahead skips a morning that has passed', bestDay([pastDay, fakeDay(1, 3)], 'morning').day.dayIndex, 1);
      same('time: a passed morning still shows when it is all that is left', bestDay([pastDay], 'morning').slot.past, true);
      same('time: morning availability hides an evening-only spot', applyView([eveningSpot], { ...DEFAULT_VIEW, worthSurfingOnly: true }, options).length, 0);
      same('time: evening availability keeps it', applyView([eveningSpot], { ...DEFAULT_VIEW, worthSurfingOnly: true, time: 'evening' }, options).length, 1);
      same('time: all day keeps it', applyView([eveningSpot], { ...DEFAULT_VIEW, worthSurfingOnly: true, time: ALL_DAY }, options).length, 1);
      same('time: best first follows the chosen time', applyView([fakeSpot('morning-4', [4], 50), eveningSpot], { ...DEFAULT_VIEW, sort: 'best', time: 'evening' }, options)[0].id, 'evening-spot');
      same('filters: max drive keeps exactly the limit', order({ maxDriveMinutes: 90 }), ['mid-3', 'near-4', 'near-5', 'near-1']);
      same('filters: filters combine with sorting', order({ sort: 'best', worthSurfingOnly: true, maxDriveMinutes: 60 }), ['near-5', 'near-4']);
      same('filters: sorting does not reorder the forecast itself', (order({ sort: 'closest' }), fakeForecast[0].id), 'far-4');
      same('filters: a spot with no drive time sorts last', applyView([fakeSpot('none', [5], null), fakeSpot('some', [5], 100)], { ...DEFAULT_VIEW, sort: 'closest' }, options).map((spot) => spot.id), ['some', 'none']);

      same('filters: under an hour shows minutes', formatDrive(31), 'about 30 min');
      same('filters: drive times round to 5 minutes', formatDrive(102), 'about 1 hr 40 min');
      same('filters: whole hours drop the minutes', formatDrive(239), 'about 4 hr');
      same('filters: unknown drive time gives nothing', formatDrive(null), null);
      same('filters: short drive under an hour', formatDriveShort(29), '30m');
      same('filters: short drive with hours and minutes', formatDriveShort(102), '1h 40m');
      same('filters: short drive on the hour', formatDriveShort(180), '3h');
      same('filters: unknown short drive gives nothing', formatDriveShort(null), null);

      same('filters: best day is the highest rating', bestDay(fakeForecast[2].days, 'morning').day.dayIndex, 1);
      same('filters: a tied best day goes to the soonest', bestDay([fakeDay(0, 2), fakeDay(1, 4), fakeDay(2, 4)], 'morning').day.dayIndex, 1);
      same('filters: best day skips days with no rating', bestDay([fakeDay(0, null), fakeDay(1, 1)], 'morning').day.dayIndex, 1);
      same('filters: no ratings gives no best day', bestDay([fakeDay(0, null)], 'morning'), null);

      same('filters: nothing saved gives the defaults', restoreView(null), DEFAULT_VIEW);
      same('filters: restores saved choices', restoreView({ rangeDays: 5, time: 'evening', sort: 'best', worthSurfingOnly: true, maxDriveMinutes: 120 }), { rangeDays: 5, time: 'evening', sort: 'best', worthSurfingOnly: true, maxDriveMinutes: 120 });
      same('filters: ignores unrecognized saved choices', restoreView({ rangeDays: 4, time: 'night', sort: 'toString', worthSurfingOnly: 'yes', maxDriveMinutes: 45 }), DEFAULT_VIEW);
      same('filters: choices saved by the older version are ignored safely', restoreView({ sort: 'best', dayIndex: 3 }), { ...DEFAULT_VIEW, sort: 'best' });

      // --- Buoys ---
      // Real format from NDBC, including a row with no wave data and a missing period.
      const ndbcSample = [
        '#YY  MM DD hh mm WDIR WSPD GST  WVHT   DPD   APD MWD   PRES  ATMP  WTMP  DEWP  VIS PTDY  TIDE',
        '#yr  mo dy hr mn degT m/s  m/s     m   sec   sec degT   hPa  degC  degC  degC  nmi  hPa    ft',
        '2026 11 06 19 40 100 5.0 6.0    MM    MM    MM  MM   1016    MM  29.2    MM   MM   MM    MM',
        '2026 11 06 19 26  MM   MM   MM   1.0    10   6.7  58     MM    MM  29.2    MM   MM   MM    MM',
        '2026 11 06 18 56  MM   MM   MM   1.2    MM   6.7  67     MM    MM  29.0    MM   MM   MM    MM',
        '',
      ].join('\n');
      const parsed = parseNdbcText(ndbcSample);
      same('buoys: skips rows with no wave height', parsed.length, 2);
      same('buoys: newest reading comes first', parsed[0].time, '2026-11-06T19:26:00.000Z');
      same('buoys: converts meters to feet', parsed[0].waveHeightFt, 3.28084);
      same('buoys: reads period and direction', [parsed[0].dominantPeriodS, parsed[0].averagePeriodS, parsed[0].directionDeg], [10, 6.7, 58]);
      same('buoys: a missing value stays empty', parsed[1].dominantPeriodS, null);
      same('buoys: stops at the reading limit', parseNdbcText(ndbcSample, 1).length, 1);
      same('buoys: an empty file gives no readings', parseNdbcText(''), []);

      const buoyRules = settings.buoyCorrection;
      const buoyNow = new Date('2026-11-06T20:00:00Z');
      const reading = (minutesAgo, waveHeightFt) => ({ time: new Date(buoyNow - minutesAgo * 60000).toISOString(), waveHeightFt });
      const flatModel = (ft) => () => ft;
      same('buoys: ratio is measured over model', computeBias([reading(30, 3)], flatModel(4), buoyNow, buoyRules).ratio, 0.75);
      same('buoys: averages the latest readings', computeBias([reading(10, 3), reading(40, 4), reading(70, 5), reading(100, 100)], flatModel(4), buoyNow, buoyRules).measuredFt, 4);
      same('buoys: ignores readings that are too old', computeBias([reading(200, 3)], flatModel(4), buoyNow, buoyRules), null);
      same('buoys: skips hours with no model value', computeBias([reading(10, 3)], flatModel(null), buoyNow, buoyRules), null);
      same('buoys: no readings gives no comparison', computeBias([], flatModel(4), buoyNow, buoyRules), null);
      same('buoys: a low reading can only lower it so far', computeBias([reading(10, 1)], flatModel(4), buoyNow, buoyRules).ratio, buoyRules.minRatio);
      same('buoys: a high reading can only raise it so far', computeBias([reading(10, 9)], flatModel(4), buoyNow, buoyRules).ratio, buoyRules.maxRatio);

      same('buoys: full strength close by', distanceStrength(30, buoyRules), 1);
      same('buoys: half strength midway', distanceStrength(80, buoyRules), 0.5);
      same('buoys: no strength far away', distanceStrength(200, buoyRules), 0);
      same('buoys: full adjustment right now', correctionFactor(0.8, 0, 1, buoyRules), 0.8);
      same('buoys: half the adjustment at 24 hours', correctionFactor(0.8, 24, 1, buoyRules), 0.9);
      same('buoys: no adjustment at 48 hours', correctionFactor(0.8, 48, 1, buoyRules), 1);
      same('buoys: no adjustment beyond 48 hours', correctionFactor(0.8, 90, 1, buoyRules), 1);
      same('buoys: distance weakens the adjustment', correctionFactor(0.8, 0, 0.5, buoyRules), 0.9);
      check('buoys: one degree of latitude is about 111 km', Math.abs(distanceKm({ lat: 26, lon: -80 }, { lat: 27, lon: -80 }) - 111) < 1);

      // Spot right next to a buoy that reads 20% below the models, at 7 am on the first day.
      const nearby = { id: 'test', name: 'Test', lat: 26, lon: -80 };
      const buoyTimes = { times, models: { only: { waveHeightFt: times.map(() => 5), swellPeriodS: times.map(() => 8), wavePeriodS: times.map(() => 6) } } };
      const at7am = new Date('2026-11-06T12:30:00Z');
      const status = buildBuoyStatus({ id: 'b', name: 'B', lat: 26, lon: -80 }, [{ time: '2026-11-06T12:00:00Z', waveHeightFt: 4 }], buoyTimes, settings, at7am);
      same('buoys: compares with the models at the buoy', [status.bias.modelFt, status.bias.ratio], [5, 0.8]);
      same('buoys: keeps the latest reading to show', status.latest.waveHeightFt, 4);
      same('buoys: no readings gives no status', buildBuoyStatus({ id: 'b' }, [], buoyTimes, settings, at7am), null);
      same('buoys: an old reading keeps the status but no correction', buildBuoyStatus({ id: 'b' }, [{ time: '2026-11-06T01:00:00Z', waveHeightFt: 4 }], buoyTimes, settings, at7am).bias, null);

      const corrected = buildSpotForecast(nearby, data, settings, '2026-11-06T07:00', status);
      same('buoys: forecast right now gets the full adjustment', corrected.now.waveHeightFt, 3.2);
      same('buoys: blended values are kept as they were', corrected.days[0].blended.morning.waveHeightFt, 4);
      // The morning window's middle, 8 am, is 1 hour ahead of 7 am.
      const thisMorningFt = 4 * (1 - 0.2 * (1 - 1 / 48));
      same('buoys: this morning is adjusted almost fully', corrected.days[0].final.morning.waveHeightFt, thisMorningFt);
      same('buoys: period is not adjusted', corrected.days[0].final.morning.swellPeriodS, 7);
      same('buoys: ratings use the adjusted height', corrected.days[0].slots.morning.score, scoreConditions({ waveHeightFt: thisMorningFt, swellPeriodS: 7 }, profile));
      const tomorrowMidday = corrected.days[1].final.midday.waveHeightFt;
      // 12 noon tomorrow is 29 hours ahead, so 1 - 0.2 x (1 - 29/48) of the 2.5 ft forecast.
      same('buoys: the adjustment fades over time', tomorrowMidday, 2.5 * (1 - 0.2 * (1 - 29 / 48)));
      same('buoys: a passed window is not adjusted', buildSpotForecast(nearby, data, settings, '2026-11-06T15:00', status).days[0].final.morning.waveHeightFt, 4);
      same('buoys: no buoy means no adjustment', buildSpotForecast(nearby, data, settings, '2026-11-06T07:00').days[0].final.morning.waveHeightFt, 4);
      const farAway = { ...nearby, lat: 30 };
      same('buoys: too far away means no adjustment', buildSpotForecast(farAway, data, settings, '2026-11-06T07:00', status).days[0].final.morning.waveHeightFt, 4);

      check('buoys: every spot has a known buoy', spots.every((spot) => buoys.some((buoy) => buoy.id === spot.buoyId)));

      // --- Spots ---
      check('spots: every spot has a drive time from each starting point', spots.every((spot) => Object.keys(settings.homes).every((home) => Number.isFinite(spot.driveMinutes[home]))));
      same('spots: there are 17', spots.length, 17);
      same('spots: IDs are unique', new Set(spots.map((spot) => spot.id)).size, spots.length);
      check('spots: listed north to south', spots.every((spot, index) => index === 0 || spot.lat < spots[index - 1].lat));

      // --- Show results ---
      const failed = results.filter((result) => !result.passed);
      const summary = failed.length ? `${failed.length} of ${results.length} tests failed` : `All ${results.length} tests passed`;
      document.querySelector('#summary').textContent = summary;
      document.querySelector('#summary').className = failed.length ? 'fail' : 'pass';
      document.title = summary;
      document.querySelector('#results').innerHTML = results
        .map((result) => {
          const item = document.createElement('li');
          item.className = result.passed ? 'pass' : 'fail';
          item.textContent = result.passed ? `✓ ${result.name}` : `✗ ${result.name}: ${result.detail}`;
          return item.outerHTML;
        })
        .join('');
    </script>
  </body>
</html>
