name: Fetch buoy and storm data

# NDBC and NHC can't be read directly from a browser, so this saves their data for the site.
# It goes on its own branch, replaced each time, so code history stays clean and the
# site doesn't rebuild every hour.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# An outside timer starts this on time, and GitHub's own schedule stays on as a backup.
# This keeps two copies from running at once. The alert job's sent record stops repeat emails.
concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch buoy readings
        run: node scripts/fetch-buoys.js buoy-data/buoys.json

      # A storm feed problem shouldn't stop the buoy data. The site treats a missing file as no flags.
      - name: Fetch tropical systems
        continue-on-error: true
        run: node scripts/fetch-tropical.js buoy-data/tropical.json

      - name: Publish to the buoy-data branch
        working-directory: buoy-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b buoy-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -q -m 'Update buoy and storm data'
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" buoy-data
